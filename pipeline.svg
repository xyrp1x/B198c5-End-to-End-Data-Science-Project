<text x="48" y="62" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="27" font-weight="700">SteamSense · End-to-end pipeline</text>
<text x="48" y="96" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">Five sequential stages from raw Steam reviews to model evaluation</text><rect x="40" y="138" width="250" height="174" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="74" cy="174" r="18" fill="#1f6feb"/><text x="74" y="179" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="60" y="220" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Data ingestion</text><text x="60" y="257" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">English-language filter</text><text x="60" y="280" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">100K review sample</text><path d="M 297 225.0 h 23 m -8 -8 l 8 8 l -8 8" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="138" width="250" height="174" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="360" cy="174" r="18" fill="#1f6feb"/><text x="360" y="179" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="346" y="220" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Text preprocessing</text><text x="346" y="257" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Clean and tokenize text</text><text x="346" y="280" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Retain sentiment words</text><path d="M 583 225.0 h 23 m -8 -8 l 8 8 l -8 8" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="612" y="138" width="250" height="174" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="646" cy="174" r="18" fill="#1f6feb"/><text x="646" y="179" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="632" y="220" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sentiment models</text><text x="632" y="257" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">VADER · Naive Bayes</text><text x="632" y="280" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Logistic Regression · BERT</text><path d="M 869 225.0 h 23 m -8 -8 l 8 8 l -8 8" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="898" y="138" width="250" height="174" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="932" cy="174" r="18" fill="#1f6feb"/><text x="932" y="179" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text><text x="918" y="220" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="700">LDA topic modeling</text><text x="918" y="257" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Separate positive and</text><text x="918" y="280" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">negative review topics</text><path d="M 1155 225.0 h 23 m -8 -8 l 8 8 l -8 8" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1184" y="138" width="250" height="174" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="1218" cy="174" r="18" fill="#1f6feb"/><text x="1218" y="179" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">05</text><text x="1204" y="220" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Evaluation</text><text x="1204" y="257" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Accuracy · Precision</text><text x="1204" y="280" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Recall · F1-score</text></svg>